services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8099}:8099"
    volumes:
      - ${RUNTIME_DATA_DIR:-./docker-data/backend}:/app/backend/data
      - ${BACKEND_LOCAL_CONFIG:-./backend/config/app.local.toml}:/app/backend/config/app.local.toml:ro
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-5175}:80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_LOG_DIR:-./docker-data/nginx/logs}:/var/log/nginx
    restart: unless-stopped
