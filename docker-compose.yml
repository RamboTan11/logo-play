services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8099}:8099"
    volumes:
      - ${RUNTIME_DATA_DIR:-./docker-data/backend}:/app/backend/data
      # The host directory must contain a complete operator-managed app.toml.
      - ${BACKEND_CONFIG_DIR:-./backend/config}:/app/backend/config:ro
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_PUBLIC_BASE_PATH: "${VITE_PUBLIC_BASE_PATH:-/generate-logo/}"
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/generate-logo/api}"
    ports:
      - "${FRONTEND_PORT:-8098}:80"
    restart: unless-stopped
