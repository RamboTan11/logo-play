# Complete pre-production configuration example. Copy to the host-private
# backend/config/app.toml when validating with Docker on a loopback address.
app_title = "Logo Generated API"
api_version = "0.1.0"
debug = false
app_env = "preproduction"
enable_development_seeds = false
cors_origins = ["http://127.0.0.1:18080", "http://localhost:18080"]
development_admin_id = "dev-admin-001"
development_admin_token = "disabled-in-preproduction"
development_customer_id = "dev-customer-001"
development_customer_access_link = "disabled-in-preproduction"
database_path = "data/logo_generated.db"
asset_root = "data/assets"
customer_frontend_base_url = "http://127.0.0.1:18080"
admin_frontend_base_url = "http://127.0.0.1:18080"
lark_worker_enabled = false
lark_worker_interval_seconds = 5
lark_delivery_max_attempts = 3
lark_claim_lease_seconds = 60
enable_real_model_smoke_tests = true
initial_admin_username = "CHANGE_ME"
initial_admin_password = "CHANGE_ME"
auth_session_secret = ""
customer_access_token_encryption_key = ""
model_connection_secret_encryption_key = ""
lark_config_encryption_key = ""
